name: Testing in CI
on:
  push:
    branches:
      - test
jobs:
  test:
    runs-on: ubuntu-latest
#    services:
    steps:
      - name: Get Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2
      - name: Get Commit IDs
        run: git log -n 5 --pretty=oneline
      - name: Get Commit ID
        run: git log -n 5 --pretty=oneline | head -n2 | tail -n1 | cut -d' ' -f1
      - name: Get Changes
        run: git diff "277a7ddcad34d1e17b5383a9c4189cb71349390d" --name-only | grep -v "~"

